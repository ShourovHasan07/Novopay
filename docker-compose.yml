version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: novapay
      POSTGRES_PASSWORD: shourov123
      POSTGRES_DB: novapay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - novapay-net

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - novapay-net

volumes:
  postgres-data:

networks:
  novapay-net:
    driver: bridge